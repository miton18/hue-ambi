[package]
name = "hue-ambi"
version = "0.2.0"
edition = "2021"
description = "Philips Hue ambilight for Raspberry Pi 5 / LibreELEC: DRM video plane capture + Hue Entertainment streaming"
license = "MIT"
repository = "https://github.com/miton18/hue-ambi"
readme = "../README.md"
publish = false

[features]
# OpenSSL compile et lie statiquement : binaire autonome pour le zip d'installation.
# Les distributions qui fournissent OpenSSL (LibreELEC) construisent avec --no-default-features.
default = ["vendored-openssl"]
vendored-openssl = ["openssl/vendored"]

[dependencies]
dma-buf = "0.5"
drm = "0.15"
drm-ffi = "0.9"
openssl = "0.10"
rustix = { version = "1", features = ["mount", "process", "time"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
